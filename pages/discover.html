<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover students who share your interests on Mutuals.">
  <title>Discover | Mutuals™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/discover.css">
</head>
<body>
  <header class="discover-bar">
    <a class="brand" href="../index.html">Mutuals<span>™</span></a>
    <div class="bar-actions">
      <a class="messages-link" href="messages.html" id="messagesLink">Messages</a>
      <span id="viewerName"></span>
      <button type="button" id="logoutButton">Log out</button>
    </div>
  </header>

  <main class="discover-main">
    <section class="deck" id="deck" aria-live="polite">
      <p class="deck-status" id="deckStatus">Loading people near you…</p>

      <article class="profile-card" id="profileCard" hidden>
        <div class="card-visual">
          <img class="card-photo" id="cardPhoto" alt="" hidden draggable="false">
          <span class="card-initials" id="cardInitials"></span>
          <span class="match-badge" id="matchBadge"></span>

          <div class="veil veil-like" id="veilLike" aria-hidden="true"><span>Like</span></div>
          <div class="veil veil-pass" id="veilPass" aria-hidden="true"><span>Pass</span></div>
        </div>

        <div class="card-body">
          <h1 class="card-name">
            <span id="cardName"></span>
            <span class="card-age" id="cardAge" hidden></span>
          </h1>
          <p class="card-nickname" id="cardNickname"></p>

          <div class="card-meta" id="cardMeta"></div>

          <div class="card-interests" id="cardInterests"></div>
        </div>
      </article>

      <div class="empty-state" id="emptyState" hidden>
        <h2 id="emptyTitle">No one new right now</h2>
        <p id="emptyCopy">
          You've seen everyone available in your hall and faculty. Check back soon —
          new students join every week.
        </p>
        <a href="signup-interests.html" id="emptyLink">Update your interests</a>
      </div>

      <p class="gesture-hint" id="gestureHint">
        Swipe <strong>down</strong> to like · swipe <strong>up</strong> to pass
      </p>

      <div class="deck-actions" id="deckActions" hidden>
        <button class="action-button undo" type="button" id="undoButton" disabled>Undo last pass</button>
      </div>
    </section>
  </main>

  <div class="match-toast" id="matchToast" role="status" aria-live="polite"></div>

  <script type="module">
    import { supabase, supabaseConfigured } from '../assets/js/supabase.js';
    import {
      buildInterestVectors,
      buildIdfMap,
      filterCandidates,
      buildDeck
    } from '../assets/js/matching.js';

    const DECK_SIZE = 20;
    const THRESHOLD = 110;        // px of travel that commits a decision
    const VELOCITY_COMMIT = 0.55; // px/ms flick commits a decision
    const WHEEL_COMMIT = 130;     // accumulated wheel delta that commits
    const WHEEL_RESET = 220;      // ms of quiet before the wheel accumulator resets

    const els = {
      status: document.getElementById('deckStatus'),
      card: document.getElementById('profileCard'),
      photo: document.getElementById('cardPhoto'),
      initials: document.getElementById('cardInitials'),
      badge: document.getElementById('matchBadge'),
      name: document.getElementById('cardName'),
      age: document.getElementById('cardAge'),
      nickname: document.getElementById('cardNickname'),
      meta: document.getElementById('cardMeta'),
      interests: document.getElementById('cardInterests'),
      actions: document.getElementById('deckActions'),
      undo: document.getElementById('undoButton'),
      empty: document.getElementById('emptyState'),
      emptyTitle: document.getElementById('emptyTitle'),
      emptyCopy: document.getElementById('emptyCopy'),
      emptyLink: document.getElementById('emptyLink'),
      hint: document.getElementById('gestureHint'),
      toast: document.getElementById('matchToast'),
      veilLike: document.getElementById('veilLike'),
      veilPass: document.getElementById('veilPass'),
      viewerName: document.getElementById('viewerName'),
      messagesLink: document.getElementById('messagesLink'),
      logout: document.getElementById('logoutButton')
    };

    let deck = [];
    let viewerId = null;
    let viewerInterests = new Set();
    let busy = false;
    let locked = false; // true while a card is animating out

    // A decision is held locally for a short window before it is written.
    // That is what makes Undo possible: there is no row to delete, and a match
    // can never be created and then revoked.
    const UNDO_WINDOW_MS = 8000;
    let pending = null; // { card, decision, timer }

    function setStatus(text) {
      els.status.textContent = text || '';
    }

    function showEmpty(title, copy, linkLabel) {
      els.card.hidden = true;
      els.actions.hidden = true;
      els.hint.hidden = true;
      els.empty.hidden = false;
      els.emptyTitle.textContent = title;
      els.emptyCopy.textContent = copy;
      if (linkLabel) {
        els.emptyLink.textContent = linkLabel;
        els.emptyLink.hidden = false;
      } else {
        els.emptyLink.hidden = true;
      }
    }

    function toast(text) {
      els.toast.textContent = text;
      els.toast.classList.add('visible');
      setTimeout(() => els.toast.classList.remove('visible'), 2600);
    }

    function initialsOf(name) {
      return (name || '?')
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('');
    }

    function clamp(n, lo, hi) {
      return n < lo ? lo : n > hi ? hi : n;
    }

    function render(card) {
      const profile = card.profile;

      els.empty.hidden = true;
      els.card.hidden = false;
      els.actions.hidden = false;
      els.hint.hidden = false;
      els.card.style.transform = '';
      els.card.style.opacity = '';
      els.card.classList.remove('dragging', 'settling');
      els.veilLike.style.opacity = '0';
      els.veilPass.style.opacity = '0';

      els.name.textContent = profile.full_name || 'Someone new';

      // age is optional on a profile (Google sign-in creates none), so the
      // comma+age only appears when there is an age to show.
      if (Number.isInteger(profile.age) && profile.age > 0) {
        els.age.textContent = profile.age;
        els.age.hidden = false;
      } else {
        els.age.textContent = '';
        els.age.hidden = true;
      }

      els.nickname.textContent = profile.nickname ? `“${profile.nickname}”` : '';
      els.nickname.hidden = !profile.nickname;

      els.badge.textContent = `${card.percent}% match`;

      if (profile.avatar_url) {
        els.photo.src = profile.avatar_url;
        els.photo.alt = `${profile.full_name || 'Student'} photo`;
        els.photo.hidden = false;
        els.initials.hidden = true;
      } else {
        els.photo.hidden = true;
        els.initials.hidden = false;
        els.initials.textContent = initialsOf(profile.full_name);
      }

      els.meta.innerHTML = '';
      [
        profile.level ? `${profile.level} level` : null,
        profile.hall,
        profile.department
      ]
        .filter(Boolean)
        .forEach(value => {
          const chip = document.createElement('span');
          chip.className = 'meta-chip';
          chip.textContent = value;
          els.meta.appendChild(chip);
        });

      els.interests.innerHTML = '';
      const shared = card.sharedInterests || [];
      const caption = document.createElement('span');
      caption.className = 'interests-caption';
      caption.textContent = shared.length ? 'You both like' : 'Interests';
      els.interests.appendChild(caption);

      const list = shared.length ? shared : card.interests || [];
      list.slice(0, 8).forEach(name => {
        const pill = document.createElement('span');
        pill.className = 'interest-pill';
        pill.textContent = name;
        els.interests.appendChild(pill);
      });

      wireDrag();
    }

    function showNext() {
      if (!deck.length) {
        setStatus('');
        els.card.style.transform = '';
        showEmpty(
          'No one new right now',
          "You've seen everyone available in your hall and faculty. Check back soon — new students join every week.",
          'Update your interests'
        );
        return;
      }

      const [next] = deck;
      setStatus(`${deck.length} ${deck.length === 1 ? 'person' : 'people'} to meet`);
      render(next);
    }

    async function loadDeck() {
      const { data: sessionData } = await supabase.auth.getSession();
      const user = sessionData?.session?.user;

      if (!user) {
        setStatus('');
        showEmpty(
          'You need an account first',
          'Log in to start discovering students who share your interests.',
          'Create an account'
        );
        els.emptyLink.href = 'signup.html';
        return;
      }

      viewerId = user.id;
      els.viewerName.textContent = user.email || '';

      const [profilesResult, poolResult, statsResult, swipesResult, blocksResult, ownResult] =
        await Promise.all([
          supabase.from('profiles').select(
            'id, full_name, nickname, age, hall, department, level, avatar_url, onboarding_completed'
          ),
          supabase.rpc('get_interest_pool'),
          supabase.from('interest_stats').select('idf, interests(name)'),
          supabase.from('swipes').select('swiped_id, decision'),
          supabase.from('blocks').select('blocker_id, blocked_id'),
          supabase.from('user_interests').select('interest_id, interests(name)').eq('user_id', user.id)
        ]);

      const failure = [profilesResult, poolResult, statsResult, swipesResult, blocksResult, ownResult]
        .find(result => result.error);

      if (failure) {
        setStatus('');
        showEmpty('Something went wrong', failure.error.message, null);
        return;
      }

      const pool = poolResult.data || [];

      // The pool deliberately excludes the viewer, so their own interests
      // are read straight from user_interests (RLS scopes it to them).
      const ownRows = (ownResult.data || [])
        .map(row => row.interests && row.interests.name)
        .filter(Boolean)
        .map(name => ({ user_id: viewerId, interest_name: name }));

      viewerInterests = new Set(ownRows.map(row => row.interest_name));

      if (!viewerInterests.size) {
        setStatus('');
        showEmpty(
          'Pick your interests first',
          'We match on shared interests, so choose at least a few before discovering people.',
          'Choose interests'
        );
        els.emptyLink.href = 'signup-interests.html';
        return;
      }

      const statRows = (statsResult.data || []).map(row => ({
        interest_name: row.interests && row.interests.name,
        idf: row.idf
      }));

      const idfMap = buildIdfMap(statRows);
      const vectors = buildInterestVectors(pool.concat(ownRows), idfMap);
      const candidates = filterCandidates(
        viewerId,
        profilesResult.data || [],
        swipesResult.data || [],
        blocksResult.data || []
      );

      const scored = buildDeck(viewerId, candidates, vectors, { size: DECK_SIZE });

      deck = scored.map(card => {
        const id = card.profile.id;
        const theirs = pool
          .filter(row => row.user_id === id)
          .map(row => row.interest_name);
        return {
          ...card,
          interests: theirs,
          sharedInterests: theirs.filter(name => viewerInterests.has(name))
        };
      });

      showNext();
    }

    /**
     * Writes a decision for real. Errors are reported but never freeze the deck —
     * the card has already left the screen by the time this runs.
     */
    async function persist(card, decision) {
      const { error } = await supabase.from('swipes').insert({
        swiper_id: viewerId,
        swiped_id: card.profile.id,
        decision
      });

      if (error) {
        // 23505 = already swiped in a previous session; the deck is simply stale.
        if (error.code !== '23505') toast(error.message);
        return;
      }

      if (decision !== 'like') return;

      const { data: match } = await supabase
        .from('matches')
        .select('id')
        .or(`and(user_one.eq.${viewerId},user_two.eq.${card.profile.id}),and(user_one.eq.${card.profile.id},user_two.eq.${viewerId})`)
        .maybeSingle();

      if (!match) {
        toast('Like sent');
        return;
      }

      // It's a match — the whole point of a like is the conversation, so go
      // straight there. No delay: the redirect is the reward.
      toast(`It's a match with ${card.profile.full_name || 'your match'} ✳`);
      window.location.href = `messages.html?match=${encodeURIComponent(match.id)}`;
    }

    async function commitPending() {
      if (!pending) return;
      const { card, decision, timer } = pending;
      clearTimeout(timer);
      pending = null;
      els.undo.disabled = true;
      await persist(card, decision);
    }

    /* ---------- decision flow ---------- */
    function decide(decision) {
      if (busy || locked || !deck.length) return;
      busy = true;
      locked = true;

      const card = deck[0];

      // fling the card off on the gesture axis, then advance
      const dir = decision === 'like' ? 1 : -1;
      const veil = decision === 'like' ? els.veilLike : els.veilPass;
      veil.style.opacity = '1';
      els.card.classList.add('settling');
      els.card.style.transform = `translate3d(0, ${dir * 130}%, 0) rotate(${dir * 6}deg)`;
      els.card.style.opacity = '0';

      // A held pass becomes final the moment the next decision happens.
      const previous = pending;
      pending = null;
      if (previous) {
        clearTimeout(previous.timer);
        persist(previous.card, previous.decision);
      }

      deck.shift();

      window.setTimeout(() => {
        locked = false;
        showNext();
        busy = false;
      }, 300);

      if (decision === 'like') {
        // A like is written immediately: it has to be, because a match is the
        // reason to redirect, and a match cannot exist while the swipe is still
        // sitting in an undo buffer. Consequence: likes are not undoable —
        // only passes are, which is also the safer direction to be wrong in.
        els.undo.disabled = true;
        persist(card, 'like');
        return;
      }

      els.undo.disabled = false;
      pending = {
        card,
        decision,
        timer: setTimeout(() => { commitPending(); }, UNDO_WINDOW_MS)
      };
    }

    function undo() {
      if (busy || !pending) return;
      const { card, timer } = pending;
      clearTimeout(timer);
      pending = null;
      els.undo.disabled = true;
      deck.unshift(card);
      if (deck.length === 1) showNext();
      else {
        showNext();
      }
      toast(`Brought back ${card.profile.full_name || 'that profile'}`);
    }

    /* ---------- vertical drag gesture: down = like, up = pass ---------- */
    function paint(dy, dx) {
      const y = clamp(dy, -520, 520);
      const x = clamp(dx * 0.18, -70, 70);
      const rot = clamp(dx * 0.02, -5, 5) + clamp(y * -0.012, -3.5, 3.5);
      els.card.style.transform = `translate3d(${x.toFixed(1)}px, ${y}px, 0) rotate(${rot.toFixed(2)}deg)`;

      const down = Math.max(0, y) / THRESHOLD;
      const up = Math.max(0, -y) / THRESHOLD;
      els.veilLike.style.opacity = String(clamp(down, 0, 1));
      els.veilPass.style.opacity = String(clamp(up, 0, 1));
    }

    function wireDrag() {
      const card = els.card;
      let startY = 0;
      let startX = 0;
      let lastY = 0;
      let lastT = 0;
      let vy = 0;
      let dy = 0;
      let dx = 0;
      let dragging = false;

      card.onpointerdown = e => {
        if (locked || busy || e.button === 2) return;
        dragging = true;
        startY = lastY = e.clientY;
        startX = e.clientX;
        lastT = performance.now();
        dy = dx = vy = 0;
        card.classList.add('dragging');
        card.classList.remove('settling');
        try { card.setPointerCapture(e.pointerId); } catch (_) {}
      };

      card.onpointermove = e => {
        if (!dragging) return;
        const now = performance.now();
        dy = e.clientY - startY;
        dx = e.clientX - startX;

        const dt = Math.max(1, now - lastT);
        vy = (e.clientY - lastY) / dt;
        lastY = e.clientY;
        lastT = now;

        paint(dy, dx);
      };

      function end(e) {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');

        const flick = Math.abs(vy) > VELOCITY_COMMIT;
        const commit = Math.abs(dy) > THRESHOLD || (flick && Math.abs(dy) > 46);

        if (commit) {
          decide(dy > 0 ? 'like' : 'pass');
        } else {
          card.classList.add('settling');
          paint(0, 0);
          els.veilLike.style.opacity = '0';
          els.veilPass.style.opacity = '0';
          setTimeout(() => card.classList.remove('settling'), 600);
        }

        dy = dx = 0;
        if (e && e.pointerId != null && card.hasPointerCapture && card.hasPointerCapture(e.pointerId)) {
          try { card.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      card.onpointerup = end;
      card.onpointercancel = end;
    }

    /* ---------- wheel: trackpad / mouse scroll is the same gesture ---------- */
    let wheelAcc = 0;
    let wheelTimer = null;

    window.addEventListener('wheel', e => {
      if (els.card.hidden || locked || busy) return;
      e.preventDefault();

      wheelAcc += e.deltaY;
      const preview = clamp(wheelAcc * 0.55, -THRESHOLD * 0.95, THRESHOLD * 0.95);
      paint(preview, 0);

      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAcc = 0; }, WHEEL_RESET);

      if (wheelAcc >= WHEEL_COMMIT) {
        wheelAcc = 0;
        decide('like');
      } else if (wheelAcc <= -WHEEL_COMMIT) {
        wheelAcc = 0;
        decide('pass');
      }
    }, { passive: false });

    /* ---------- keyboard ---------- */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); decide('like'); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); decide('pass'); }
      else if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); undo(); }
    });

    els.undo.addEventListener('click', undo);

    // Never lose a decision to a closed tab: commit as the page goes away.
    window.addEventListener('pagehide', () => {
      if (!pending) return;
      const { card, decision } = pending;
      pending = null;
      supabase.from('swipes').insert({
        swiper_id: viewerId,
        swiped_id: card.profile.id,
        decision
      });
    });

    els.logout.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '../index.html';
    });

    if (!supabaseConfigured || !supabase) {
      setStatus('');
      showEmpty('Not configured', 'Supabase credentials are missing.', null);
    } else {
      loadDeck().catch(error => {
        setStatus('');
        showEmpty('Something went wrong', error.message, null);
      });
    }
  </script>
</body>
</html>
